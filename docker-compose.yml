name: axword-voice

services:
  panel:
    build:
      context: .
      target: runtime
    image: axword-voice/panel:dev
    ports:
      - "127.0.0.1:21337:21337"
    environment:
      VOICE_CONTROL_HOME: /data
      LOLVOICE_PORT: "21337"
      LOLVOICE_TOKEN: ${LOLVOICE_TOKEN:-dev-token}
      LOLVOICE_TRUSTED_HOSTS: ${LOLVOICE_TRUSTED_HOSTS:-172.16.0.0/12,192.168.65.0/24}
    volumes:
      - voice-data:/data
    restart: unless-stopped

  webui:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app/webui
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      LOLVOICE_API: http://panel:21337
    volumes:
      - ./webui:/app/webui
      - webui-modules:/app/webui/node_modules
    depends_on:
      - panel

  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    image: axword-voice/dev:latest
    environment:
      VOICE_CONTROL_HOME: /tmp/voice-control-test
    volumes:
      - ./tests:/app/tests
      - ./app:/app/app
      - ./server:/app/server
      - ./controller:/app/controller
      - ./controls:/app/controls
    command: ["python", "-m", "pytest", "-q", "-m", "not slow and not audio"]

  lint:
    profiles: ["test"]
    build:
      context: .
      target: dev
    image: axword-voice/dev:latest
    volumes:
      - .:/app:ro
    command: sh -c "python -m ruff check . && python tools/check_copy.py"

volumes:
  voice-data:
  webui-modules:
