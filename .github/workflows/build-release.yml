name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build web panel
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: Check tests
        run: python -m pytest -m "not slow and not audio"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\Inno Setup 6'
      - name: Build application, installer and portable ZIP
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: axword-voice-windows
          path: |
            dist/installer/AxwordVoiceSetup.exe
            dist/AxwordVoice-*-portable.zip
          if-no-files-found: error
          retention-days: 14
